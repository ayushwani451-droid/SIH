        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen flex items-center justify-center font-body-md text-on-background p-6">
<!-- Transactional Screen: Navigation Suppressed -->
<main class="w-full max-w-md">
<!-- Brand Header -->
<div class="text-center mb-8">
<h1 class="text-display-lg font-display-lg text-primary mb-2">LegalLense</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Manufacturer Registration Portal</p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-8 shadow-sm">
<p class="hidden mb-2 text-body-md font-body-md text-error" id="register-error"></p>
<form class="space-y-6" id="register-form" method="POST" onsubmit="return handleRegister(event)">
<!-- Company Name -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="companyName">Company Name</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="companyName" name="companyName" required="" type="text"/>
</div>
<!-- Full Name -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="fullName">Full Name</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface" id="fullName" name="fullName" required="" type="text"/>
</div>
<!-- GSTIN / Registration Number -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="gstin">GSTIN / Registration Number</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="gstin" name="gstin" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="email">Email Address</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="email" name="email" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="password">Password</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="password" name="password" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-label-md font-label-md text-primary mb-1" for="confirmPassword">Confirm Password</label>
<input class="w-full px-4 py-2 bg-surface border border-outline-variant rounded-DEFAULT text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="confirmPassword" name="confirmPassword" required="" type="password"/>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-secondary bg-surface border-outline-variant rounded-DEFAULT focus:ring-secondary focus:ring-offset-background" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-body-md font-body-md">
<label class="text-on-surface-variant" for="terms">
                            I accept the <a class="text-secondary font-medium hover:underline" href="#" onclick="return LL.comingSoon(event,'Terms and Conditions')">Terms and Conditions</a> and <a class="text-secondary font-medium hover:underline" href="#" onclick="return LL.comingSoon(event,'Privacy Policy')">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-DEFAULT text-body-lg font-body-lg font-semibold text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[44px] items-center" type="submit">
                        Register Company
                    </button>
</div>
</form>
<div class="mt-6 text-center text-body-md font-body-md text-on-surface-variant">
                Already registered? <a class="text-secondary font-medium hover:underline" href="login.html?role=manufacturer">Sign in here</a>
</div>
</div>
<!-- Govt Notice -->
<div class="mt-8 text-center text-label-md font-label-md text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 16px;">verified</span>
            Govt. of India Official Portal
        </div>
</main>
<script src="assets/app.js"></script>
<script src="assets/auth-client.js"></script>
<script>
    async function handleRegister(e) {
        e.preventDefault();
        var companyName = document.getElementById('companyName').value.trim();
        var fullName = document.getElementById('fullName').value.trim();
        var gstin = document.getElementById('gstin').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;
        var terms = document.getElementById('terms').checked;
        var errorEl = document.getElementById('register-error');

        function fail(msg) {
            errorEl.textContent = msg;
            errorEl.classList.remove('hidden');
            return false;
        }

        if (!companyName || !fullName || !email || !password || !confirmPassword) return fail('Please fill in all required fields.');
        if (password.length < 8) return fail('Password must be at least 8 characters.');
        if (password !== confirmPassword) return fail('Passwords do not match.');
        if (!terms) return fail('You must accept the Terms and Conditions to continue.');

        errorEl.classList.add('hidden');
        var submit = e.target.querySelector('button[type="submit"]');
        submit.disabled = true;
        submit.textContent = 'Creating account...';
        try {
            await LLAuth.signup({ fullName: fullName, email: email, password: password, role: 'manufacturer', companyName: companyName, gstin: gstin });
            location.href = 'verify-email.html?email=' + encodeURIComponent(email);
        } catch (err) {
            submit.disabled = false;
            submit.textContent = 'Register Company';
            return fail(err.message);
        }
        return false;
    }
</script>
</body></html>

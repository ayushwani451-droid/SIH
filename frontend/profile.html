<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile - LegalLense</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-slate-50 flex items-center justify-center font-['Inter'] text-slate-900 p-6"><main class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 w-full max-w-xl"><div class="flex items-center justify-between mb-8"><div><h1 class="text-2xl font-bold text-[#00274a]">Profile</h1><p class="text-slate-600">Manage your LegalLense account information.</p></div><a href="javascript:history.back()" class="text-[#006a6a] font-semibold text-sm">Back</a></div><p id="message" class="hidden mb-4 text-sm"></p><form id="form" class="space-y-5"><label class="block text-sm font-semibold">Full name<input id="fullName" required class="mt-2 w-full rounded-lg border-slate-300" type="text"></label><label class="block text-sm font-semibold">Email<input id="email" readonly class="mt-2 w-full rounded-lg border-slate-300 bg-slate-100" type="email"></label><div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm"><div><span class="font-semibold">Email status</span><p id="verified" class="mt-2 text-teal-700">Verified</p></div><div><span class="font-semibold">Account created</span><p id="created" class="mt-2 text-slate-600"></p></div></div><button class="rounded-lg bg-[#006a6a] text-white px-5 py-3 font-semibold">Save profile</button></form></main><script src="assets/auth-client.js"></script><script>var message=document.getElementById('message');LLAuth.profile().then(function(result){var user=result.user;document.getElementById('fullName').value=user.fullName;document.getElementById('email').value=user.email;document.getElementById('verified').textContent=user.emailVerified?'Verified':'Not verified';document.getElementById('created').textContent=user.createdAt?new Date(user.createdAt).toLocaleDateString():'';}).catch(function(){location.replace('login.html');});document.getElementById('form').onsubmit=async function(e){e.preventDefault();try{await LLAuth.updateProfile({fullName:document.getElementById('fullName').value});message.textContent='Profile updated.';message.className='mb-4 text-sm text-teal-700';}catch(err){message.textContent=err.message;message.className='mb-4 text-sm text-red-600';}};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password - LegalLense</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-slate-50 flex items-center justify-center font-['Inter'] p-6"><main class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 w-full max-w-md"><h1 class="text-2xl font-bold text-[#00274a] mb-2">Reset your password</h1><p class="text-slate-600 mb-6">Enter your email to receive a password reset code.</p><p id="message" class="hidden mb-4 text-sm"></p><form id="form" class="space-y-4"><input id="email" type="email" required class="w-full rounded-lg border-slate-300" placeholder="Email address"><button class="w-full rounded-lg bg-[#006a6a] text-white py-3 font-semibold">Send reset code</button></form><p class="mt-6 text-sm"><a href="login.html" class="text-[#006a6a] font-semibold">Back to Login</a></p></main><script src="assets/auth-client.js"></script><script>var message=document.getElementById('message');document.getElementById('form').onsubmit=async function(e){e.preventDefault();try{var email=document.getElementById('email').value;await LLAuth.forgotPassword(email);message.textContent='If the account exists, a reset code was sent.';message.className='mb-4 text-sm text-teal-700';setTimeout(function(){location.href='reset-password.html?email='+encodeURIComponent(email);},700);}catch(err){message.textContent=err.message;message.className='mb-4 text-sm text-red-600';}};</script></body></html>

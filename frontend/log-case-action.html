<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LegalLense - Case Action</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#76d6d5",
                        "surface-container-low": "#f3f4f5",
                        "secondary-container": "#90efef",
                        "secondary": "#006a6a",
                        "surface": "#f8f9fa",
                        "inverse-surface": "#2e3132",
                        "primary-fixed": "#d3e4ff",
                        "secondary-fixed": "#93f2f2",
                        "on-primary-fixed-variant": "#1c4877",
                        "primary-fixed-dim": "#a2c9ff",
                        "surface-tint": "#386090",
                        "on-primary-fixed": "#001c38",
                        "on-primary-container": "#82a9dd",
                        "surface-variant": "#e1e3e4",
                        "surface-dim": "#d9dadb",
                        "background": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#ffdfa0",
                        "on-tertiary-container": "#d39d00",
                        "primary": "#00274a",
                        "outline": "#737780",
                        "on-background": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-fixed": "#261a00",
                        "on-secondary-fixed": "#002020",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#332300",
                        "surface-container-highest": "#e1e3e4",
                        "primary-container": "#0b3d6b",
                        "on-secondary-container": "#006e6e",
                        "on-error": "#ffffff",
                        "tertiary-container": "#4e3800",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "inverse-primary": "#a2c9ff",
                        "outline-variant": "#c3c6d0",
                        "inverse-on-surface": "#f0f1f2",
                        "tertiary-fixed-dim": "#fbbc00",
                        "surface-bright": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "on-surface-variant": "#42474f",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#004f4f",
                        "error-container": "#ffdad6",
                        "surface-container": "#edeeef",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "260px",
                        "container-max": "1440px",
                        "unit": "4px",
                        "margin-page": "32px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full bg-surface-dim font-body-md text-on-surface antialiased flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div aria-modal="true" class="fixed inset-0 bg-on-background/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" role="dialog">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-2xl flex flex-col max-h-[921px] overflow-hidden border border-outline-variant">
<!-- Header -->
<div class="px-8 py-6 border-b border-outline-variant flex justify-between items-center bg-surface-bright sticky top-0 z-10">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-error-container text-on-error-container">High Priority</span>
<span class="text-body-md font-body-md text-on-surface-variant" id="modal-case-id">Case #LL-2023-0892</span>
</div>
<h2 class="text-headline-md font-headline-md text-primary">Log Enforcement Action</h2>
</div>
<button aria-label="Close modal" class="p-2 rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors" id="close-modal-btn">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-8 overflow-y-auto flex-1 flex flex-col gap-6">
<!-- Status Row -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="status-dropdown">Update Case Status</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-10 text-body-lg font-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent cursor-pointer transition-shadow" id="status-dropdown">
<option value="open">Open</option>
<option value="under_review">Under Review</option>
<option value="escalated">Escalated</option>
<option value="closed">Closed</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Notes Section -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface" for="inspector-notes">Inspector Notes</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-4 text-body-lg font-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent resize-none transition-shadow" id="inspector-notes" maxlength="1000" placeholder="Detail the enforcement action taken, findings, and next steps..." rows="6"></textarea>
<div class="text-right">
<span class="text-[11px] text-on-surface-variant" id="char-counter">0 / 1000 characters</span>
</div>
</div>
<!-- Evidence Upload -->
<div class="flex flex-col gap-2">
<span class="text-label-md font-label-md text-on-surface">Attach Evidence Photos</span>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center gap-4 bg-surface-bright hover:bg-surface-container-low transition-colors cursor-pointer group" id="evidence-drop-zone">
<input accept="image/*" class="hidden" id="evidence-file-input" type="file"/>
<div class="p-4 rounded-full bg-primary-fixed text-on-primary-fixed group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-3xl">upload_file</span>
</div>
<div class="text-center">
<p class="text-body-lg font-body-lg text-primary font-semibold mb-1">Click to upload or drag and drop</p>
<p class="text-body-md font-body-md text-on-surface-variant">SVG, PNG, JPG or GIF (max. 10MB)</p>
</div>
</div>
<!-- Attached file (hidden until a file is chosen) -->
<div class="hidden mt-2 flex items-center justify-between p-3 border border-outline-variant rounded-lg bg-surface-container-lowest" id="evidence-file-row">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-surface-tint">image</span>
<div>
<p class="text-body-md font-body-md text-on-surface font-medium line-clamp-1" id="evidence-file-name">site_inspection_01.jpg</p>
<p class="text-[11px] text-on-surface-variant" id="evidence-file-size">2.4 MB</p>
</div>
</div>
<button aria-label="Remove file" class="p-2 text-error hover:bg-error-container rounded-full transition-colors" id="remove-evidence-btn">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-8 py-6 border-t border-outline-variant bg-surface-bright flex justify-end gap-4 sticky bottom-0">
<button class="px-6 py-3 rounded-lg text-body-lg font-body-lg font-semibold text-primary hover:bg-surface-container-low transition-colors" id="cancel-btn">
                    Cancel
                </button>
<button class="px-6 py-3 rounded-lg bg-secondary text-on-secondary text-body-lg font-body-lg font-semibold shadow-sm hover:shadow-md hover:bg-secondary/90 transition-all flex items-center gap-2" id="save-action-btn">
<span class="material-symbols-outlined icon-filled text-xl">save</span>
                    Save Case Action
                </button>
</div>
</div>
</div>
<script src="assets/app.js"></script>
<script src="assets/auth-client.js"></script>
<script src="assets/official-header.js"></script>
<script>
    if (LL.requireRole('official')) {
        var caseId = LL.qs('id') || 'CASE-LM2024-089';
        var caseObj = LL.getCase(caseId);
        var backUrl = 'case-details.html?id=' + encodeURIComponent(caseId);

        if (!caseObj) {
            document.body.innerHTML = '<div class="max-w-md mx-auto mt-24 text-center bg-surface-container-lowest border border-outline-variant rounded-xl p-10">' +
                '<span class="material-symbols-outlined text-5xl text-on-surface-variant mb-4">search_off</span>' +
                '<h2 class="text-headline-md font-headline-md text-primary mb-2">Case Not Found</h2>' +
                '<p class="text-body-md font-body-md text-on-surface-variant mb-6">We couldn\'t find a case matching that ID.</p>' +
                '<button class="px-6 py-2.5 rounded bg-primary text-on-primary font-semibold" onclick="location.href=\'scan-history.html\'">Back to Scan History</button></div>';
        } else {
            document.getElementById('modal-case-id').textContent = 'Case #' + caseObj.id;
            document.getElementById('status-dropdown').value = caseObj.status;

            var notes = document.getElementById('inspector-notes');
            var counter = document.getElementById('char-counter');
            notes.addEventListener('input', function () {
                counter.textContent = notes.value.length + ' / 1000 characters';
            });

            var chosenFile = null;
            var fileInput = document.getElementById('evidence-file-input');
            var dropZone = document.getElementById('evidence-drop-zone');
            var fileRow = document.getElementById('evidence-file-row');
            dropZone.addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function () {
                if (this.files && this.files.length) {
                    chosenFile = this.files[0];
                    document.getElementById('evidence-file-name').textContent = chosenFile.name;
                    document.getElementById('evidence-file-size').textContent = (chosenFile.size / 1024 / 1024).toFixed(1) + ' MB';
                    fileRow.classList.remove('hidden');
                }
            });
            document.getElementById('remove-evidence-btn').addEventListener('click', function () {
                chosenFile = null;
                fileInput.value = '';
                fileRow.classList.add('hidden');
            });

            document.getElementById('close-modal-btn').addEventListener('click', function () { location.href = backUrl; });
            document.getElementById('cancel-btn').addEventListener('click', function () { location.href = backUrl; });

            document.getElementById('save-action-btn').addEventListener('click', function () {
                var status = document.getElementById('status-dropdown').value;
                var noteText = notes.value.trim();
                if (!noteText) {
                    notes.classList.add('ring-2', 'ring-error');
                    notes.focus();
                    return;
                }
                LL.addCaseAction(caseObj.id, { status: status, notes: noteText, fileName: chosenFile ? chosenFile.name : null });
                location.href = backUrl;
            });
        }
    }
</script>
</body></html>

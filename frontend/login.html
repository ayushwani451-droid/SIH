<body class="h-full bg-background flex items-center justify-center font-sans antialiased text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-md p-gutter sm:p-margin-page">
<!-- Branding Header -->
<div class="text-center mb-8 flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mb-4 border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    policy
                </span>
</div>
<h1 class="text-display-lg font-display-lg text-primary mb-2">LegalLense</h1>
<p class="text-body-md font-body-md text-on-surface-variant uppercase tracking-wider font-semibold">Department of Consumer Affairs</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<!-- Role Selector Tabs -->
<div class="flex border-b border-outline-variant bg-surface-container-low">
<button class="flex-1 py-4 text-body-md font-body-md font-semibold text-primary border-b-2 border-primary bg-surface-container-lowest transition-colors flex items-center justify-center gap-2" id="tab-official" onclick="selectRole('official')" type="button">
<span class="material-symbols-outlined text-xl">admin_panel_settings</span>
                    Official
                </button>
<button class="flex-1 py-4 text-body-md font-body-md font-medium text-on-surface-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2 border-b-2 border-transparent" id="tab-manufacturer" onclick="selectRole('manufacturer')" type="button">
<span class="material-symbols-outlined text-xl">factory</span>
                    Manufacturer
                </button>
</div>
<!-- Form Container -->
<div class="p-8">
<form class="space-y-6" id="login-form" method="POST" onsubmit="return handleLogin(event)">
<!-- Email/Username Field -->
<div class="space-y-2">
<label class="block text-label-md font-label-md text-on-surface" for="identifier">Email / Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:ring-1 focus:ring-primary focus:border-primary placeholder-outline transition-colors" id="identifier" name="identifier" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-label-md font-label-md text-on-surface" for="password">Password</label>
<a class="text-label-md font-label-md text-primary hover:text-on-primary-fixed-variant transition-colors" href="forgot-password.html">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:ring-1 focus:ring-primary focus:border-primary placeholder-outline transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" onclick="var p=document.getElementById('password'); p.type = p.type==='password'?'text':'password'; this.querySelector('span').textContent = p.type==='password'?'visibility_off':'visibility';" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<p class="hidden text-body-md font-body-md text-error" id="login-error">Please enter your credentials to continue.</p>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-DEFAULT shadow-sm text-body-lg font-body-lg font-semibold text-on-primary bg-secondary hover:bg-on-secondary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors min-h-[44px]" type="submit">
                        Secure Login
                        <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
<!-- Security Footer -->
<div class="bg-surface-container-low border-t border-outline-variant p-4 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">verified_user</span>
<p class="text-label-md font-label-md text-on-surface-variant font-normal">Govt. of India Secure Portal</p>
</div>
</div>
<!-- Meta Links -->
<div class="mt-8 flex justify-center gap-6 text-label-md font-label-md text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#" onclick="return LL.comingSoon(event,'Privacy Policy')">Privacy Policy</a>
<span class="w-[1px] bg-outline-variant h-4"></span>
<a class="hover:text-primary transition-colors" href="#" onclick="return LL.comingSoon(event,'Terms of Service')">Terms of Service</a>
<span class="w-[1px] bg-outline-variant h-4"></span>
<a class="hover:text-primary transition-colors" href="#" onclick="return LL.comingSoon(event,'Help Center')">Help Center</a>
</div>
<p class="mt-4 flex justify-center text-body-md font-body-md text-on-surface-variant">New manufacturer? <a class="text-secondary font-semibold hover:underline ml-1" href="registration.html">Register here</a></p>
</main>
<script src="assets/app.js"></script>
<script src="assets/auth-client.js"></script>
<script>
    var selectedRole = LL.qs('role') === 'manufacturer' ? 'manufacturer' : 'official';

    function selectRole(role) {
        selectedRole = role;
        var officialTab = document.getElementById('tab-official');
        var manufacturerTab = document.getElementById('tab-manufacturer');
        var active = 'flex-1 py-4 text-body-md font-body-md font-semibold text-primary border-b-2 border-primary bg-surface-container-lowest transition-colors flex items-center justify-center gap-2';
        var inactive = 'flex-1 py-4 text-body-md font-body-md font-medium text-on-surface-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2 border-b-2 border-transparent';
        officialTab.className = role === 'official' ? active : inactive;
        manufacturerTab.className = role === 'manufacturer' ? active : inactive;
    }

    async function handleLogin(e) {
        e.preventDefault();
        var identifier = document.getElementById('identifier').value.trim();
        var password = document.getElementById('password').value.trim();
        var errorEl = document.getElementById('login-error');
        if (!identifier || !password) {
            errorEl.classList.remove('hidden');
            return false;
        }
        errorEl.classList.add('hidden');
        var submit = e.target.querySelector('button[type="submit"]');
        submit.disabled = true;
        submit.textContent = 'Signing in...';
        try {
            var result = await LLAuth.login({ email: identifier, password: password, role: selectedRole });
            sessionStorage.setItem('legallense_session_v1', JSON.stringify({
                id: result.user.id,
                role: result.user.role,
                name: result.user.fullName,
                email: result.user.email,
                org: result.user.companyName || (result.user.role === 'official' ? 'Enforcement Division' : 'Manufacturer')
            }));
            location.href = selectedRole === 'official' ? 'official-dashboard.html' : 'manufacturer-dashboard.html';
        } catch (err) {
            errorEl.textContent = err.message;
            errorEl.classList.remove('hidden');
            submit.disabled = false;
            submit.innerHTML = 'Secure Login <span class="material-symbols-outlined text-lg">arrow_forward</span>';
        }
        return false;
    }

    selectRole(selectedRole);
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - LegalLense</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-slate-50 flex items-center justify-center font-['Inter'] p-6"><main class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 w-full max-w-md"><h1 class="text-2xl font-bold text-[#00274a] mb-2">Choose a new password</h1><p class="text-slate-600 mb-6">Enter the reset code from your email.</p><p id="message" class="hidden mb-4 text-sm"></p><form id="form" class="space-y-4"><input id="email" type="email" required class="w-full rounded-lg border-slate-300" placeholder="Email address"><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required class="w-full rounded-lg border-slate-300" placeholder="6-digit OTP"><input id="password" type="password" minlength="8" required class="w-full rounded-lg border-slate-300" placeholder="New password"><input id="confirm" type="password" minlength="8" required class="w-full rounded-lg border-slate-300" placeholder="Confirm password"><button class="w-full rounded-lg bg-[#006a6a] text-white py-3 font-semibold">Reset password</button></form></main><script src="assets/auth-client.js"></script><script>var params=new URLSearchParams(location.search),email=document.getElementById('email');email.value=params.get('email')||'';var message=document.getElementById('message');document.getElementById('form').onsubmit=async function(e){e.preventDefault();var password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){message.textContent='Passwords do not match.';message.className='mb-4 text-sm text-red-600';return;}try{await LLAuth.resetPassword({email:email.value,otp:document.getElementById('otp').value,password:password});message.textContent='Password reset successfully.';message.className='mb-4 text-sm text-teal-700';setTimeout(function(){location.href='login.html';},700);}catch(err){message.textContent=err.message;message.className='mb-4 text-sm text-red-600';}};</script></body></html>

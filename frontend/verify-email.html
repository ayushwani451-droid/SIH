<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email - LegalLense</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"></head><body class="min-h-screen bg-slate-50 flex items-center justify-center font-['Inter'] text-slate-900 p-6"><main class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 w-full max-w-md"><h1 class="text-2xl font-bold text-[#00274a] mb-2">Verify your email</h1><p class="text-slate-600 mb-6">Enter the 6-digit code sent to your email.</p><p id="message" class="hidden mb-4 text-sm"></p><form id="form" class="space-y-4"><input id="email" type="email" required class="w-full rounded-lg border-slate-300" placeholder="Email address"><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required class="w-full rounded-lg border-slate-300" placeholder="6-digit OTP"><button class="w-full rounded-lg bg-[#006a6a] text-white py-3 font-semibold">Verify email</button></form><button id="resend" class="mt-4 text-[#006a6a] font-semibold text-sm">Resend code</button><p class="mt-6 text-sm"><a href="login.html?role=manufacturer" class="text-[#006a6a] font-semibold">Back to Login</a></p></main><script src="assets/auth-client.js"></script><script>var params=new URLSearchParams(location.search),email=document.getElementById('email');email.value=params.get('email')||'';var message=document.getElementById('message');function show(text,error){message.textContent=text;message.className='mb-4 text-sm '+(error?'text-red-600':'text-teal-700');}document.getElementById('form').onsubmit=async function(e){e.preventDefault();try{await LLAuth.verifyEmail({email:email.value,otp:document.getElementById('otp').value});show('Email verified. You can now log in.');setTimeout(function(){location.href='login.html?role=manufacturer';},700);}catch(err){show(err.message,true);}};document.getElementById('resend').onclick=async function(){try{await LLAuth.resendVerification(email.value);show('A new code was sent.');}catch(err){show(err.message,true);}};</script></body></html>
